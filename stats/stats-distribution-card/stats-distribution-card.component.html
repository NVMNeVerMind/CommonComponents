<div class="bg-white rounded-lg shadow p-6">
  <p class="text-sm font-medium text-gray-600 mb-4">{{ title }}</p>

  <div *ngIf="hasData" style="max-height: 200px;">
    <canvas baseChart
            [data]="chartData"
            [options]="chartOptions"
            type="bar">
    </canvas>
  </div>

  <p *ngIf="!hasData" class="text-center text-gray-400 py-4">Aucune donnée</p>

  <div *ngIf="outliers.length > 0" class="mt-4">
    <p class="text-xs font-semibold text-gray-500 uppercase mb-2">Outliers</p>
    <div *ngFor="let o of outliers"
         class="flex justify-between text-xs text-gray-600 py-1 border-b border-gray-100">
      <span>{{ o.studentName }}</span>
      <span class="font-semibold" [ngClass]="outlierColorClass">
        {{ o.count }} {{ unit }}{{ o.count > 1 ? 's' : '' }}
      </span>
    </div>
  </div>
</div>
