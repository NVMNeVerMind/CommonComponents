<hlm-dialog>
  <button
    *ngIf="iconName"
    type="button"
    brnDialogTrigger
    hlmBtn
    variant="destructive"
    size="icon"
    [attr.aria-label]="ariaLabel"
    [title]="ariaLabel"
  >
    <lucide-icon [name]="iconName" class="w-4 h-4"></lucide-icon>
  </button>
  <button *ngIf="title" type="button" brnDialogTrigger variant="destructive" hlmBtn>
    {{ title }}
  </button>
  <hlm-dialog-content *brnDialogContent="let ctx" class="!max-w-md !h-fit p-0 gap-0 overflow-hidden">
    <hlm-dialog-header class="px-6 py-4 border-b border-red-200 bg-red-50 text-left">
      <h2 brnDialogTitle class="text-lg font-semibold text-destructive">{{ title }}</h2>
    </hlm-dialog-header>

    <p brnDialogDescription class="px-6 py-6 text-gray-700">{{ description }}</p>

    <hlm-dialog-footer class="px-6 py-4 bg-gray-50 border-t border-gray-200">
      <button type="button" (click)="no()" brnDialogClose hlmBtn variant="ghost">{{ refuse }}</button>
      <button type="button" (click)="yes()" brnDialogClose variant="destructive" hlmBtn>{{ accept }}</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
