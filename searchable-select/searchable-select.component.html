<div class="relative">
  <button
    type="button"
    [disabled]="disabled"
    (click)="toggle()"
    class="w-full flex items-center justify-between px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-left hover:border-gray-400 focus:ring-2 focus:ring-primary focus:border-primary transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    [class.ring-2]="isOpen"
    [class.ring-primary]="isOpen"
    [class.border-primary]="isOpen"
  >
    <span [class.text-gray-400]="!selected" class="text-sm truncate">
      {{ selected?.value || placeholder }}
    </span>
    <lucide-icon
      name="chevron-down"
      class="w-4 h-4 text-gray-500 transition-transform duration-200"
      [class.rotate-180]="isOpen"
    ></lucide-icon>
  </button>

  <div
    *ngIf="isOpen"
    class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden"
  >
    <div *ngIf="searchable" class="p-2 border-b border-gray-100">
      <div class="relative">
        <lucide-icon
          name="search"
          class="absolute left-2 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
        ></lucide-icon>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          [ngModelOptions]="{standalone: true}"
          (input)="applyFilter()"
          (click)="$event.stopPropagation()"
          [placeholder]="searchPlaceholder"
          class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-md focus:ring-2 focus:ring-primary focus:border-primary outline-none"
        />
      </div>
    </div>

    <div class="max-h-48 overflow-y-auto">
      <div
        *ngIf="searchable && filtered.length === 0"
        class="px-4 py-6 text-center text-gray-400"
      >
        <lucide-icon name="search-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></lucide-icon>
        <p class="text-sm">{{ emptyMessage }}</p>
      </div>

      <button
        *ngFor="let option of (searchable ? filtered : options)"
        type="button"
        (click)="select(option)"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-left hover:bg-gray-50 transition-colors"
        [class.bg-primary/10]="selected?.id === option.id"
        [class.text-primary]="selected?.id === option.id"
      >
        <div
          *ngIf="showOptionIcon"
          class="w-6 h-6 rounded-md flex items-center justify-center"
          [class.bg-primary/15]="selected?.id === option.id"
          [class.bg-gray-100]="selected?.id !== option.id"
        >
          <lucide-icon
            name="book-open"
            class="w-3.5 h-3.5"
            [class.text-primary]="selected?.id === option.id"
            [class.text-gray-500]="selected?.id !== option.id"
          ></lucide-icon>
        </div>
        <span class="text-sm font-medium">{{ option.value }}</span>
        <lucide-icon
          *ngIf="selected?.id === option.id"
          name="check"
          class="w-4 h-4 ml-auto text-primary"
        ></lucide-icon>
      </button>
    </div>
  </div>

  <div
    *ngIf="isOpen"
    class="fixed inset-0 z-40"
    (click)="close()"
  ></div>
</div>
