<div class="flex items-center gap-2 cursor-pointer" (click)="checked()">
  <div class="w-4 h-4 shrink-0 rounded-sm border flex items-center justify-center transition-colors"
       [ngClass]="isChecked ? 'bg-primary border-primary' : 'border-foreground bg-background'">
    <svg *ngIf="isChecked" class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <label [class]="styleClass"
         [ngClass]="theme === Theme.Dark ? 'text-primary-foreground' : 'text-primary'"
         class="font-bold text-base cursor-pointer select-none">
    {{ label }}
  </label>
</div>
