<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
  <div role="dialog" aria-modal="true" aria-labelledby="cgs-title" aria-describedby="cgs-description"
       class="grid gap-4 w-full max-w-md border border-border bg-background p-6 shadow-lg sm:rounded-lg">
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 id="cgs-title" class="text-lg font-semibold leading-none tracking-tight">
        Conditions Générales de Service (CGS)
      </h2>
      <p id="cgs-description" class="text-sm text-muted-foreground">
        Veuillez lire et accepter nos Conditions Générales de Service avant de continuer.
      </p>
    </div>
    <form [formGroup]="acceptCGSFormGroup" class="flex flex-col gap-3">
      <a
        [href]="'/' + Pages.cgs"
        class="text-primary hover:text-primary/80 underline text-sm w-fit"
        rel="noopener noreferrer"
      >
        Lire les CGS complètes
      </a>
      <label for="acceptCGS" class="flex items-center gap-2 text-sm">
        <input formControlName="accept" id="acceptCGS" type="checkbox"
               class="h-4 w-4 rounded border-input accent-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
        J'accepte les CGS
      </label>
    </form>
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
      <button type="button" (click)="reject()" hlmBtn variant="outline">Refuser</button>
      <button type="button" (click)="accept()" [disabled]="acceptCGSFormGroup.invalid" hlmBtn>Accepter</button>
    </div>
  </div>
</div>
