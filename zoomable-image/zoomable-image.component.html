<hlm-dialog>
    <button type="button" brnDialogTrigger class="relative inline-block cursor-pointer group w-fit shrink-0 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="Agrandir l'image">
        <img [src]="src" [ngClass]="thumbnailClass" class="object-contain rounded-lg" [alt]="alt"/>
        <span class="absolute top-2 right-2 bg-background/80 rounded-full p-1 shadow group-hover:scale-110 transition-transform">
            <lucide-icon name="search" class="w-4 h-4 text-muted-foreground"></lucide-icon>
        </span>
    </button>
    <hlm-dialog-content *brnDialogContent="let ctx" class="!max-w-[95vw] w-fit">
        <hlm-dialog-header class="sr-only">
            <h2 hlmDialogTitle>Image agrandie</h2>
            <p hlmDialogDescription>{{ alt }}</p>
        </hlm-dialog-header>
        <img [src]="src" [alt]="alt" class="max-w-full max-h-[80vh] object-contain">
    </hlm-dialog-content>
</hlm-dialog>
