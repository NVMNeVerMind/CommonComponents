<button hlmBtn variant="ghost" class="hover:bg-transparent p-0"
        (click)="showChangelog()"
        aria-label="Notifications">
    <app-user-avatar [fullName]="authService.getFullName()" [showBadge]="showNotification()"></app-user-avatar>
</button>

<div *ngIf="displayChangelog" class="fixed inset-0 bg-black bg-opacity-50 z-40">
    <div class="absolute inset-y-0 right-0 w-[600px] bg-white shadow-xl flex flex-col">
        <button (click)="closePanel()" class="text-gray-400 hover:text-gray-500 absolute top-4 right-4">
            <lucide-icon class="" name="XCircle"></lucide-icon>
        </button>
        <div class="p-6 flex-1 overflow-y-auto">
            <div class="prose max-w-none" [innerHTML]="content"></div>
        </div>
    </div>
</div>
