<div class="relative inline-block">
    <brn-avatar hlmAvatar [class]="avatarClass">
        <lucide-icon *ngIf="bellTrigger"
                     brnAvatarFallback
                     hlmAvatarFallback
                     name="bell"
                     [class]="unread ? 'text-destructive' : 'text-white'"
                     [attr.aria-label]="unread ? 'Notification non lue' : 'Notifications'"></lucide-icon>
        <span *ngIf="!bellTrigger && initials" brnAvatarFallback hlmAvatarFallback>{{ initials }}</span>
        <lucide-icon *ngIf="!bellTrigger && !initials" brnAvatarFallback hlmAvatarFallback name="user"></lucide-icon>
    </brn-avatar>
</div>
