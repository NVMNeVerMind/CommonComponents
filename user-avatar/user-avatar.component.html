<div class="relative inline-block">
    <brn-avatar hlmAvatar [class]="avatarClass">
        <span *ngIf="initials" brnAvatarFallback hlmAvatarFallback>{{ initials }}</span>
        <lucide-icon *ngIf="!initials" brnAvatarFallback hlmAvatarFallback name="user"></lucide-icon>
    </brn-avatar>
    <span *ngIf="showBadge"
          hlmBadge
          variant="destructive"
          class="absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-white p-0"
          aria-label="Notification non lue">
    </span>
</div>
